# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Docker CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      #backend
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: "8000"

      #frontend
      STREAMLIT_HOST: 0.0.0.0
      STREAMLIT_PORT: "8501"
      BACKEND_URL: http://backend:8000

      # Placeholder values for CI
      OPENAI_API_KEY: ci-placeholder
      PINECONE_API_KEY: ci-placeholder
      PINECONE_INDEX: ci-placeholder
      LANGSMITH_API_KEY: ci-placeholder
      LANGSMITH_TRACING: "false"
      LANGSMITH_PROJECT: ci-placeholder
      LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    
    # Docker commands
    - name: Validate Compose configuration
      run: docker compose config -q
    - name: Build Docker images
      run: docker compose build
    - name: Start services
      run: docker compose up -d --wait

    - name: Check backend
      run: |
        curl --fail --retry 5 --retry-connrefused \
          --retry-delay 2 \
          http://localhost:${FASTAPI_PORT}/docs

    - name: Check frontend
      run: |
        curl --fail --retry 5 --retry-connrefused \
          --retry-delay 2 \
          http://localhost:${STREAMLIT_PORT}/_stcore/health

    - name: Show logs on failure
      if: failure()
      run: docker compose logs --no-color

    - name: Stop services
      if: always()
      run: docker compose down --remove-orphans
